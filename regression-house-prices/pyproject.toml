[project]
name = "house-prices"
version = "0.1.0"
description = "Local end-to-end regression ML project: house price prediction"
requires-python = ">=3.12,<3.13"
dependencies = [
    # No sqlalchemy dependency: pandas.read_sql() works directly against a
    # sqlite3 DBAPI connection without it. (This also matters for
    # Dockerfile.airflow -- see the comment there -- since sqlalchemy would
    # conflict with Airflow's own SQLAlchemy 1.4 pin.)
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "mlflow>=2.14,<2.17",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
